name: MATLAB Chapter 6 screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-chapter6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-examples:
    # Standard GitHub-hosted runner, not a larger/paid runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out only this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify original source bytes
        run: sha256sum --check SOURCE_SHA256.txt

      - name: Install virtual display and Chinese fonts from Ubuntu
        timeout-minutes: 5
        run: |
          mkdir -p ci-diagnostics output
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends xvfb x11-utils fontconfig fonts-noto-cjk libgl1-mesa-dri libgl1-mesa-glx
          fc-cache -f
          fc-match 'Noto Sans CJK SC' | tee ci-diagnostics/cjk-font.txt
          fc-list :lang=zh family | sort -u > ci-diagnostics/chinese-fonts.txt

      - name: Start Xvfb and verify display readiness
        run: |
          nohup Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp +extension GLX +render -noreset > ci-diagnostics/xvfb.log 2>&1 &
          for attempt in $(seq 1 30); do
            if xdpyinfo -display :99 > ci-diagnostics/display.txt 2>&1; then
              echo 'DISPLAY=:99' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat ci-diagnostics/xvfb.log
          exit 1

      - name: Set up actual MATLAB R2024b
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2024b
          install-system-dependencies: true
          cache: false

      - name: Run graphics smoke test and all 28 examples
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: ci_run_chapter6
          startup-options: -softwareopengl -logfile matlab-startup.log
          generate-summary: false

      - name: Run new two dimensional plotting experiment
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5
        with:
          command: ci_run_lab
          startup-options: -softwareopengl
          generate-summary: false

      - name: Verify captured files and report counts
        if: ${{ always() }}
        run: python3 ci/verify_outputs.py

      - name: Preserve screenshots, ZIP, manifests, and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MATLAB-Chapter6-R2024b-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            ci-diagnostics/
            matlab-startup.log
            lab-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
